<!-- Design System -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="30" fill="url(#bg_grad)"/>
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="bird_gold" x1="25" y1="65" x2="95" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4A261"/>
      <stop offset="1" stop-color="#E0A96D"/>
    </linearGradient>
    <linearGradient id="star_cyan" x1="75" y1="20" x2="100" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72EFDD"/>
      <stop offset="1" stop-color="#48E5C2"/>
    </linearGradient>
  </defs>
  <!-- Stylized soaring bird wing aiming up towards stars -->
  <path d="M28 78C38 68 52 58 72 52C88 47 96 36 96 36C96 36 85 55 68 66C54 75 42 80 28 78Z" fill="url(#bird_gold)"/>
  <path d="M36 84C48 78 60 74 76 72C85 71 91 66 91 66C91 66 82 76 68 81C55 85 46 86 36 84Z" fill="url(#bird_gold)" opacity="0.6"/>
  <!-- Celestial Pole Star / Cross Sparkle -->
  <path d="M86 24L88.5 32L96.5 34.5L88.5 37L86 45L83.5 37L75.5 34.5L83.5 32L86 24Z" fill="url(#star_cyan)"/>
  <!-- Tiny subtle sparkle -->
  <circle cx="58" cy="32" r="2" fill="#72EFDD" opacity="0.8"/>
  <circle cx="98" cy="54" r="1.5" fill="#E0A96D" opacity="0.7"/>
</svg>
